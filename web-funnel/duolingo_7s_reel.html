<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Duolingo vs Real Life — 7s Vox Reel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@700;800;900&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #FDFBF7;
      font-family: 'Lexend', -apple-system, sans-serif;
      position: relative;
    }

    #paper-texture {
      position: absolute;
      top: 0; left: 0; width: 1080px; height: 1920px;
      background-image: radial-gradient(#E5DFD3 1px, transparent 1px);
      background-size: 24px 24px;
      opacity: 0.35;
      pointer-events: none;
      z-index: 100;
    }

    .vine-border {
      position: absolute;
      top: 0; left: 0; width: 1080px; height: 1920px;
      border: 24px solid #1B3B2B;
      border-radius: 48px;
      pointer-events: none;
      z-index: 90;
      box-shadow: inset 0 0 0 6px #FDFBF7, inset 0 0 0 12px #2D5A3F;
    }

    /* Container split */
    .reel-container {
      width: 1080px;
      height: 1920px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .split-panel {
      width: 100%;
      height: 960px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px;
      position: relative;
      overflow: hidden;
    }

    /* Top: Duolingo Fantasy */
    .top-panel {
      background: linear-gradient(180deg, #FEF08A 0%, #FEF9C3 100%);
      border-bottom: 8px solid #1B1C1A;
    }

    /* Bottom: Panama Reality */
    .bottom-panel {
      background: linear-gradient(180deg, #BAE6FD 0%, #FED7AA 100%);
    }

    /* Stamp Badges (Crisp Vector, No Cartoon Emojis) */
    .stamp-badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 14px 28px;
      border-radius: 100px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      border: 3px solid rgba(0,0,0,0.08);
      margin-bottom: 20px;
      z-index: 10;
    }
    .badge-green { background: #22C55E; color: #FFFFFF; }
    .badge-red { background: #EF4444; color: #FFFFFF; }

    .panel-title {
      font-size: 54px;
      font-weight: 900;
      color: #1A1A1A;
      text-align: center;
      line-height: 1.15;
      margin-bottom: 24px;
      letter-spacing: -1px;
      z-index: 10;
    }

    .card-frame {
      width: 760px;
      height: 520px;
      border-radius: 32px;
      overflow: hidden;
      position: relative;
      background: #FFFFFF;
      box-shadow: 0 20px 50px rgba(0,0,0,0.12);
      border: 6px solid #1B1C1A;
      z-index: 10;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Animated elements */
    .deadpan-cloud {
      position: absolute;
      top: 40px;
      right: 40px;
      background: #FFFFFF;
      padding: 14px 28px;
      border-radius: 100px;
      font-size: 26px;
      font-weight: 900;
      color: #1B1C1A;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      border: 4px solid #1B1C1A;
      animation: cloudDrift 3s ease-in-out infinite alternate;
      z-index: 20;
    }

    @keyframes cloudDrift {
      0% { transform: translateX(0px); }
      100% { transform: translateX(-16px); }
    }

    .wa-bubble-float {
      position: absolute;
      bottom: 24px;
      left: 24px;
      right: 24px;
      background: #DCF8C6;
      border: 4px solid #075E54;
      border-radius: 20px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      z-index: 20;
    }

    /* Center Lightning Slash Divider */
    .lightning-slash {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-4deg);
      background: #EF4444;
      color: #FFFFFF;
      font-size: 32px;
      font-weight: 900;
      padding: 14px 44px;
      border-radius: 100px;
      border: 6px solid #1B1C1A;
      box-shadow: 0 12px 36px rgba(0,0,0,0.25);
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Bottom Evergreen Brand Pill */
    .bottom-cta-pill {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: #1B1C1A;
      color: #FFFFFF;
      padding: 20px 48px;
      border-radius: 100px;
      font-size: 30px;
      font-weight: 900;
      box-shadow: 0 16px 40px rgba(0,0,0,0.3);
      border: 4px solid #FEF08A;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* Camera motion transitions for 7s Vox beat */
    .vox-camera-anim {
      animation: cameraShift 7s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes cameraShift {
      0% { transform: scale(1.0) translateY(0); }
      40% { transform: scale(1.02) translateY(10px); }
      42% { transform: scale(1.06) translateY(-40px); } /* Comic snap at vinyl scratch */
      100% { transform: scale(1.0) translateY(0); }
    }
  </style>
</head>
<body class="vox-camera-anim">

  <div id="paper-texture"></div>
  <div class="vine-border"></div>

  <div class="reel-container">

    <!-- TOP: DUOLINGO 180-DAY STREAK -->
    <div class="split-panel top-panel">
      <div class="stamp-badge badge-green">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>180-DAY DUOLINGO STREAK</span>
      </div>
      <h2 class="panel-title">"The cat is in the kitchen."</h2>
      <div class="card-frame">
        <img class="card-img" src="poquito_7s_duolingo_reel.jpg" style="object-position: center top;" />
        <div class="deadpan-cloud">._.</div>
      </div>
    </div>

    <!-- CENTER LIGHTNING SNAP -->
    <div class="lightning-slash">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      <span>VS REAL LIFE</span>
    </div>

    <!-- BOTTOM: PANAMA REALITY -->
    <div class="split-panel bottom-panel">
      <div class="stamp-badge badge-red">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span>DAY 2 IN PANAMA</span>
      </div>
      <h2 class="panel-title">Smoking A/C & 0:42 Audio Note</h2>
      <div class="card-frame">
        <img class="card-img" src="poquito_7s_duolingo_reel.jpg" style="object-position: center bottom;" />
        <div class="wa-bubble-float">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#075E54" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 0 0-8.66 15l-1.34 5 5-1.34A10 10 0 1 0 12 2z"/></svg>
          <div>
            <div style="font-size: 18px; font-weight: 800; color: #075E54;">Technician Audio Note</div>
            <div style="font-size: 24px; font-weight: 900; color: #1B1C1A;">▶ ılı·ll·ll·lı·ll 0:42</div>
          </div>
        </div>
      </div>
    </div>

    <!-- BOTTOM EVERGREEN CTA -->
    <div class="bottom-cta-pill">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FEF08A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
      <span>Read caption ➔ Try PoquitoTalk.com</span>
    </div>

  </div>

  <script src="tracker.js?v=1.0.0" defer></script>
</body>
</html>
