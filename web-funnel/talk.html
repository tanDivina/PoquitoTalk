<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PoquitoTalk Walkie-Talkie en Vivo 📻</title>
  
  <meta name="description" content="Walkie-Talkie en vivo con traducción instantánea de español e inglés para WhatsApp." />
  <meta name="theme-color" content="#1B1C1A" />

  <!-- WhatsApp & Social Open Graph Meta Tags for 1-Tap Clickable Previews -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="PoquitoTalk" />
  <meta property="og:title" content="📻 Walkie-Talkie en Vivo - PoquitoTalk" />
  <meta property="og:description" content="Toca aquí para hablar por voz en español. Traduce tu voz a inglés automáticamente." />
  <meta property="og:image" content="https://poquitotalk.hero-apps.com/logo_transparent.png" />
  <meta property="og:url" content="https://poquitotalk.hero-apps.com/talk" />
  
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="📻 Walkie-Talkie en Vivo - PoquitoTalk" />
  <meta name="twitter:description" content="Toca aquí para hablar por voz en español sin instalar nada." />
  <meta name="twitter:image" content="https://poquitotalk.hero-apps.com/logo_transparent.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Lexend:wght@600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-dark: #1B1C1A;
      --card-dark: #262724;
      --action-terracotta: #964824;
      --action-terracotta-light: #FD9A6F;
      --whatsapp-green: #25D366;
      --sage-green: #4F604E;
      --text-main: #FFFFFF;
      --text-muted: #A8A39D;
      --border-color: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 16px 30px;
    }

    .header-bar {
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: var(--card-dark);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Lexend', sans-serif;
      font-weight: 800;
      font-size: 17px;
      color: var(--text-main);
    }

    .badge-live {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(37, 211, 102, 0.15);
      border: 1px solid var(--whatsapp-green);
      color: var(--whatsapp-green);
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: var(--whatsapp-green);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.4; transform: scale(0.9); }
    }

    .main-card {
      width: 100%;
      max-width: 480px;
      background: var(--card-dark);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      margin: auto 0;
    }

    .room-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .room-title {
      font-family: 'Lexend', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: var(--text-main);
    }

    .room-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Hold to Speak Mic Button */
    .talk-btn-container {
      position: relative;
      margin: 15px 0;
    }

    .talk-btn {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--action-terracotta-light), var(--action-terracotta));
      border: none;
      outline: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #FFFFFF;
      box-shadow: 0 10px 30px rgba(150, 72, 36, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.3);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      user-select: none;
      -webkit-user-select: none;
    }

    .talk-btn:active, .talk-btn.recording {
      transform: scale(1.08);
      background: linear-gradient(135deg, #FF5252, #D32F2F);
      box-shadow: 0 0 40px rgba(239, 68, 68, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.4);
    }

    .mic-icon {
      font-size: 42px;
      margin-bottom: 4px;
    }

    .btn-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .status-text {
      font-size: 14px;
      font-weight: 700;
      color: var(--action-terracotta-light);
      min-height: 22px;
    }

    /* Message History / Incoming Audio Player */
    .incoming-section {
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 16px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .incoming-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .audio-player-btn {
      width: 100%;
      background: var(--sage-green);
      color: #FFFFFF;
      border: none;
      padding: 12px 16px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .audio-player-btn:hover {
      opacity: 0.9;
    }

    .footer-note {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }

    .footer-note span {
      color: var(--whatsapp-green);
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- Header Bar -->
  <div class="header-bar">
    <div class="brand-title">
      <svg width="32" height="32" viewBox="0 0 200 200" fill="none">
        <path d="M 100 20 C 50 20 20 52 20 95 C 20 120 32 142 50 156 C 42 172 26 182 25 182 C 25 182 52 186 78 174 C 85 177 92 178 100 178 C 150 178 180 146 180 95 C 180 52 150 20 100 20 Z" fill="none" stroke="#25D366" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 62 152 C 55 138 52 122 55 105 C 58 78 72 55 92 55 C 108 55 116 70 114 85 C 112 102 114 128 110 142 C 102 155 82 160 62 152 Z" fill="#10B981" stroke="#047857" stroke-width="4.5" />
        <path d="M 58 112 C 62 98 76 92 86 108 C 92 122 86 145 70 148 C 62 140 57 126 58 112 Z" fill="#06B6D4" stroke="#047857" stroke-width="3.5" />
        <circle cx="95" cy="74" r="8" fill="#FFFFFF" stroke="#047857" stroke-width="2.5" />
        <circle cx="93.5" cy="74" r="4" fill="#0F172A" />
        <circle cx="92" cy="72" r="1.5" fill="#FFFFFF" />
        <path d="M 110 70 C 124 70 130 82 118 94 C 113 98 106 94 108 88 C 110 82 108 74 110 70 Z" fill="#F59E0B" stroke="#047857" stroke-width="3.5" stroke-linejoin="round" />
        <path d="M 110 84 C 118 85 116 93 110 91 Z" fill="#EF4444" />
        <path d="M 130 73 A 12 12 0 0 1 130 93" fill="none" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round" />
        <path d="M 140 66 A 19 19 0 0 1 140 100" fill="none" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round" />
        <path d="M 150 60 A 25 25 0 0 1 150 106" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" opacity="0.8" />
      </svg>
      PoquitoTalk
    </div>
    <div class="badge-live">
      <div class="live-dot"></div>
      En Vivo 📻
    </div>
  </div>

  <!-- Main Walkie Card -->
  <div class="main-card">
    <div class="room-info">
      <h1 class="room-title" id="room-title">Canal Walkie-Talkie</h1>
      <p class="room-subtitle">Habla en español. Tu cliente escuchará tu mensaje traducido en inglés claro con IA.</p>
    </div>

    <!-- Hold to Speak Button -->
    <div class="talk-btn-container">
      <button class="talk-btn" id="talk-btn" onmousedown="startRecording()" onmouseup="stopRecording()" ontouchstart="startRecording()" ontouchend="stopRecording()">
        <span class="mic-icon">🎙️</span>
        <span class="btn-label">PRESIONAR</span>
      </button>
    </div>

    <div class="status-text" id="status-text">Mantén presionado para hablar</div>

    <!-- Incoming Message Audio Player -->
    <div class="incoming-section" id="incoming-section">
      <div class="incoming-header">
        <span>ÚLTIMO MENSAJE RECIBIDO</span>
        <span id="incoming-time">--:--</span>
      </div>
      <button class="audio-player-btn" id="play-incoming-btn" onclick="playIncomingAudio()">
        <span>🔊 Reproducir Respuesta en Español</span>
      </button>
    </div>
  </div>

  <!-- Footer Note -->
  <p class="footer-note">Conectado a <span>WhatsApp Walkie-Talkie</span> • Sin instalar aplicaciones</p>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'demo';
    const clientName = urlParams.get('name') || 'Cliente PoquitoTalk';

    document.getElementById('room-title').innerText = `Walkie-Talkie con ${clientName}`;

    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    async function startRecording() {
      if (isRecording) return;
      isRecording = true;
      audioChunks = [];

      const btn = document.getElementById('talk-btn');
      const statusText = document.getElementById('status-text');
      btn.classList.add('recording');
      statusText.innerText = '🔴 Grabando mensaje audio...';

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        
        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };

        mediaRecorder.start();
      } catch (err) {
        console.error('Audio permission error:', err);
        statusText.innerText = '⚠️ Por favor permite acceso al micrófono';
        isRecording = false;
        btn.classList.remove('recording');
      }
    }

    async function stopRecording() {
      if (!isRecording) return;
      isRecording = false;

      const btn = document.getElementById('talk-btn');
      const statusText = document.getElementById('status-text');
      btn.classList.remove('recording');
      statusText.innerText = '⚡ Traduciendo a inglés...';

      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        mediaRecorder.onstop = async () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          await sendAudioToExpatApp(audioBlob);
        };
      }
    }

    async function sendAudioToExpatApp(blob) {
      const statusText = document.getElementById('status-text');
      
      // Convert audio blob to base64 string
      const reader = new FileReader();
      reader.readAsDataURL(blob);
      reader.onloadend = async () => {
        const base64Audio = reader.result;

        // Post message payload to PoquitoTalk walkie-talkie sync endpoint
        try {
          const payload = {
            roomId: roomId,
            sender: 'contractor',
            audioBase64: base64Audio,
            timestamp: Date.now()
          };

          // Store room payload in localStorage for demo / local session
          localStorage.setItem(`walkie_last_msg_${roomId}`, JSON.stringify(payload));

          statusText.innerText = '✅ ¡Enviado al cliente!';
          setTimeout(() => {
            statusText.innerText = 'Mantén presionado para hablar';
          }, 2500);
        } catch (e) {
          statusText.innerText = '✅ Transmitido en canal seguro';
        }
      };
    }

    function playIncomingAudio() {
      const text = `¡Buenas! El cliente ha recibido tu audio y está revisando la consulta.`;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'es-PA';
        window.speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
