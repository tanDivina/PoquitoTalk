<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poquito Solo Reel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(180deg, #FBF9F5 0%, #F5F3EF 100%);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #stage-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Giant Zoomed-in Poquito */
    svg {
      width: 520px;
      height: 520px;
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(0 20px 30px rgba(142, 128, 113, 0.12));
    }

    /* ══════════════════════════════════════════════════════════
       ANIMATIONS — SIDE PROFILE (Anchored Body Group)
       ══════════════════════════════════════════════════════════ */
    
    /* 1. IDLE */
    .side-idle #side-body-group {
      animation: breathe 2.8s ease-in-out infinite alternate;
      transform-origin: 65px 125px;
    }
    .side-idle #side-eye-white {
      animation: blink 4.2s infinite;
      transform-origin: 76px 42px;
    }

    /* 2. PENSIVE */
    .side-pensive svg {
      transform: rotate(13deg) translateY(-8px);
    }
    .side-pensive #side-pupil {
      animation: pensiveDrift 3.2s ease-in-out infinite alternate;
    }
    .side-pensive #side-body-group {
      animation: slowBreathe 3.8s ease-in-out infinite alternate;
      transform-origin: 65px 125px;
    }

    /* 3. LISTENING */
    .side-listening svg {
      animation: listeningNod 1.8s ease-in-out infinite;
      transform-origin: 70px 135px;
    }
    .side-listening #side-eye-white {
      transform: scale(1.08);
      transform-origin: 76px 42px;
    }

    /* 4. CURIOUS */
    .side-curious svg {
      animation: curiousBob 1.6s ease-in-out infinite alternate;
      transform-origin: 70px 135px;
    }
    .side-curious #side-pupil {
      animation: pupilCurious 1.2s ease-in-out infinite alternate;
    }

    /* 5. FEATHER FLUTTER */
    .side-fluff svg {
      animation: featherRuffle 1.3s ease-in-out infinite alternate;
      transform-origin: 70px 125px;
    }
    .side-fluff #side-body-group {
      animation: bodyPoof 1.3s ease-in-out infinite alternate;
      transform-origin: 65px 125px;
    }
    .side-fluff #side-wing {
      animation: wingFlutterSide 0.16s ease-in-out infinite alternate;
      transform-origin: 32px 82px;
    }

    /* 6. SLEEPY */
    .side-sleepy #side-eye-white {
      transform: scaleY(0.35);
      transform-origin: 76px 42px;
    }
    .side-sleepy #side-body-group {
      animation: sleepyBreathe 4.5s ease-in-out infinite alternate;
      transform-origin: 65px 125px;
    }

    /* ══════════════════════════════════════════════════════════
       ANIMATIONS — FRONT VIEW
       ══════════════════════════════════════════════════════════ */

    /* 7. TALKING */
    .front-talking #front-beak-bottom {
      animation: cleanBeakTalk 0.16s ease-in-out infinite alternate;
      transform-origin: 80px 72px;
    }
    .front-talking svg {
      animation: talkBob 0.32s ease-in-out infinite alternate;
    }
    .front-talking #front-soundwaves {
      opacity: 1 !important;
      animation: wavePulse 0.45s ease-in-out infinite alternate;
    }
    .front-talking #front-body {
      animation: breathe 2.4s ease-in-out infinite alternate;
      transform-origin: 80px 132px;
    }

    /* 8. TROPICAL SWAY */
    .front-sway svg {
      animation: tropicalSway 1.6s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
      transform-origin: 80px 138px;
    }
    .front-sway #front-wing-left {
      animation: swayWingL 1.6s ease-in-out infinite alternate;
      transform-origin: 48px 68px;
    }
    .front-sway #front-wing-right {
      animation: swayWingR 1.6s ease-in-out infinite alternate;
      transform-origin: 112px 68px;
    }

    /* ══════════════════════════════════════════════════════════
       KEYFRAMES
       ══════════════════════════════════════════════════════════ */
    @keyframes breathe {
      0% { transform: scale(1) translateY(0); }
      100% { transform: scale(1.02, 0.98) translateY(3px); }
    }
    @keyframes slowBreathe {
      0% { transform: scale(1) translateY(0); }
      100% { transform: scale(1.03, 0.97) translateY(4px); }
    }
    @keyframes sleepyBreathe {
      0% { transform: scale(1) translateY(1px); }
      100% { transform: scale(1.015, 0.985) translateY(5px); }
    }
    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    @keyframes pensiveDrift {
      0% { transform: translate(0, 0); }
      50% { transform: translate(3px, -4px); }
      100% { transform: translate(1px, -5px); }
    }
    @keyframes listeningNod {
      0% { transform: rotate(-5deg) translateY(-2px) scale(1.04); }
      40% { transform: rotate(-2deg) translateY(0px) scale(1.04); }
      70% { transform: rotate(-6deg) translateY(-4px) scale(1.04); }
      100% { transform: rotate(-5deg) translateY(-2px) scale(1.04); }
    }
    @keyframes featherRuffle {
      0%, 100% { transform: scale(1) rotate(0); }
      30% { transform: scale(1.07, 1.04) rotate(-3deg); }
      60% { transform: scale(1.09, 1.05) rotate(3deg); }
      85% { transform: scale(1.02) rotate(-1deg); }
    }
    @keyframes bodyPoof {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.07); }
    }
    @keyframes wingFlutterSide {
      0% { transform: rotate(0); }
      100% { transform: rotate(-18deg); }
    }
    @keyframes curiousBob {
      0% { transform: rotate(-6deg) translateY(0); }
      100% { transform: rotate(8deg) translateY(-4px); }
    }
    @keyframes pupilCurious {
      0% { transform: translate(-1.5px, 0); }
      100% { transform: translate(2.5px, -1.5px); }
    }
    @keyframes cleanBeakTalk {
      0% { transform: translateY(0) scaleY(1); }
      100% { transform: translateY(5px) scaleY(1.3); }
    }
    @keyframes talkBob {
      0% { transform: translateY(0) rotate(0); }
      100% { transform: translateY(-4px) rotate(1.5deg); }
    }
    @keyframes wavePulse {
      0% { transform: scale(0.95); opacity: 0.3; }
      100% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes tropicalSway {
      0% { transform: rotate(-8deg) translateX(-6px); }
      100% { transform: rotate(8deg) translateX(6px); }
    }
    @keyframes swayWingL {
      0% { transform: rotate(10deg); }
      100% { transform: rotate(-8deg); }
    }
    @keyframes swayWingR {
      0% { transform: rotate(8deg); }
      100% { transform: rotate(-10deg); }
    }
  </style>
</head>
<body>

<div id="stage-container" class="side-idle">
  <!-- ─── Side-View SVG (Zero Gap Left Hair Root) ─── -->
  <svg id="svg-side" viewBox="0 0 160 160" fill="none">
    <g id="side-perch"><path d="M 30 135 Q 70 132 115 135" stroke="#B45309" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /></g>
    <g id="side-claws"><path d="M 48 124 C 46 131 48 138 52 138 M 56 124 C 54 131 56 138 60 138 M 70 124 C 68 131 70 138 74 138 M 78 124 C 76 131 78 138 82 138" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round" /></g>
    <!-- Body & Crown Group (Permanently anchored) -->
    <g id="side-body-group">
      <path d="M 35 125 C 27 108 25 90 29 70 C 33 42 50 18 73 18 C 91 18 100 34 98 52 C 95 72 97 100 92 116 C 82 131 58 136 35 125 Z" fill="#10B981" stroke="#047857" stroke-width="4.5" stroke-linejoin="round" />
      <g id="side-crest">
        <path d="M 58 19.2 C 55 13 52 9 47 8" stroke="#047857" stroke-width="3.5" stroke-linecap="round" fill="none" />
        <path d="M 67 17.8 C 64 12 61 9 56 7" stroke="#047857" stroke-width="3" stroke-linecap="round" fill="none" />
      </g>
    </g>
    <g id="side-wing"><path d="M 32 82 C 37 66 53 60 65 78 C 72 94 65 120 46 123 C 37 114 31 98 32 82 Z" fill="#06B6D4" stroke="#047857" stroke-width="3.5" stroke-linejoin="round" /></g>
    <g id="side-head">
      <g id="side-eye"><circle id="side-eye-white" cx="76" cy="42" r="9" fill="#FFF" stroke="#047857" stroke-width="2.5" /><circle id="side-pupil" cx="74.5" cy="42" r="4.5" fill="#0F172A" /><circle cx="72.5" cy="40" r="1.8" fill="#FFF" /></g>
      <!-- Clean Golden Parrot Beak -->
      <g id="side-beak-top"><path d="M 90 36 C 106 36 114 50 100 62 C 95 65 88 61 89 55 C 91 49 88 40 90 36 Z" fill="#F59E0B" stroke="#047857" stroke-width="3.5" stroke-linejoin="round" /></g>
      <g id="side-beak-bottom"><path d="M 90 56 C 96 58 98 62 92 63 C 89 63 88 59 90 56 Z" fill="#D97706" stroke="#047857" stroke-width="1.8" /></g>
    </g>
  </svg>

  <!-- ─── Front-View SVG ─── -->
  <svg id="svg-front" viewBox="0 0 160 160" fill="none" style="display:none">
    <g id="front-perch"><path d="M 30 138 Q 80 134 130 138" stroke="#B45309" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /></g>
    <g id="front-claws">
      <path d="M 62 127 C 60 133 62 139 66 139 M 70 127 C 68 133 70 139 74 139" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
      <path d="M 86 127 C 84 133 86 139 90 139 M 94 127 C 92 133 94 139 98 139" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
    </g>
    <g id="front-body">
      <path
        d="M 80 18 C 96 18 108 30 112 50 C 116 72 118 100 110 118 C 104 130 96 132 80 132 C 64 132 56 130 50 118 C 42 100 44 72 48 50 C 52 30 64 18 80 18 Z"
        fill="#10B981" stroke="#047857" stroke-width="4.5" stroke-linejoin="round"
      />
      <ellipse cx="80" cy="100" rx="18" ry="22" fill="#34D399" opacity="0.4" />
    </g>
    <g id="front-wing-left"><path d="M 48 68 C 38 74 34 90 38 104 C 40 110 46 112 50 108 C 48 96 47 80 48 68 Z" fill="#06B6D4" stroke="#047857" stroke-width="3" stroke-linejoin="round" /></g>
    <g id="front-wing-right"><path d="M 112 68 C 122 74 126 90 122 104 C 120 110 114 112 110 108 C 112 96 113 80 112 68 Z" fill="#06B6D4" stroke="#047857" stroke-width="3" stroke-linejoin="round" /></g>
    
    <g id="front-head">
      <circle cx="67" cy="56" r="9" fill="#FFF" stroke="#047857" stroke-width="2.5" />
      <circle cx="69" cy="56" r="4.5" fill="#0F172A" />
      <circle cx="67" cy="54" r="1.8" fill="#FFF" />
      <circle cx="93" cy="56" r="9" fill="#FFF" stroke="#047857" stroke-width="2.5" />
      <circle cx="95" cy="56" r="4.5" fill="#0F172A" />
      <circle cx="93" cy="54" r="1.8" fill="#FFF" />
      
      <!-- Lower Beak Mandible -->
      <g id="front-beak-bottom">
        <path d="M 74 72 C 76 81 84 81 86 72 L 83 75 C 81 77 79 77 77 75 Z" fill="#D97706" stroke="#047857" stroke-width="2" stroke-linejoin="round" />
      </g>
      
      <!-- Upper Beak Cone -->
      <g id="front-beak-top">
        <path
          d="M 72 65 C 74 61 86 61 88 65 L 83 76 C 82 78 78 78 77 76 Z"
          fill="#F59E0B" stroke="#047857" stroke-width="3" stroke-linejoin="round"
        />
      </g>
    </g>
    
    <g id="front-soundwaves" opacity="0">
      <path d="M 70 86 A 12 12 0 0 0 90 86" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
      <path d="M 64 92 A 20 20 0 0 0 96 92" fill="none" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 58 98 A 26 26 0 0 0 102 98" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    </g>
  </svg>
</div>

<script>
  const stage = document.getElementById('stage-container');
  const svgSide = document.getElementById('svg-side');
  const svgFront = document.getElementById('svg-front');

  const FRONT_STATES = ['talking', 'sway'];

  window.setPoquitoState = function(stateName) {
    const isFront = FRONT_STATES.includes(stateName);
    stage.className = '';

    if (isFront) {
      svgSide.style.display = 'none';
      svgFront.style.display = '';
      stage.className = 'front-' + stateName;
    } else {
      svgFront.style.display = 'none';
      svgSide.style.display = '';
      stage.className = 'side-' + stateName;
    }
  };
</script>
<script src="tracker.js?v=1.0.0" defer></script>
</body>
</html>
