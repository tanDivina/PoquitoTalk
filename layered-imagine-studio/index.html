<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imagine Layers • AI Multi-Layer Decomposition & Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Application Header -->
  <header class="app-header">
    <div class="brand-section">
      <div class="brand-logo">⚡</div>
      <h1 class="brand-title">IMAGINE LAYERS</h1>
      <span class="brand-badge">Decomposed Synthesis</span>
    </div>

    <!-- Center Mode Switcher -->
    <div class="header-center-tools">
      <div class="mode-segmented-control">
        <button id="mode-2d-btn" class="segmented-btn active">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>
          2D Composite
        </button>
        <button id="mode-3d-btn" class="segmented-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
          3D Exploded Depth
        </button>
      </div>
    </div>

    <!-- Header Actions & Status -->
    <div class="header-actions">
      <div id="status-pill" class="status-pill">
        <span class="status-dot"></span> Ready
      </div>
      <button id="btn-export-composite" class="btn-secondary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export Composite
      </button>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="app-workspace">

    <!-- Left Sidebar: Scene & Generation -->
    <aside class="sidebar-left">
      <div>
        <div class="sidebar-section-title">Decomposed Scene Presets</div>
        <select id="preset-selector" class="preset-select">
          <!-- Populated by JavaScript -->
        </select>
      </div>

      <div>
        <div class="sidebar-section-title">Scene Generation Prompt</div>
        <textarea id="global-prompt-input" class="prompt-textarea" placeholder="Describe a complete visual scene to synthesize and decompose into discrete semantic layers..."></textarea>
      </div>

      <button id="btn-generate-new" class="btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        Synthesize & Decompose
      </button>

      <hr style="border: none; border-top: 1px solid var(--border-subtle);">

      <div>
        <div class="sidebar-section-title">Multi-Part Batch Actions</div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <button id="btn-export-all" class="btn-secondary" style="width: 100%;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
            Export All Layers (PNGs)
          </button>
        </div>
      </div>
    </aside>

    <!-- Center Interactive Viewport -->
    <section class="center-viewport">
      
      <!-- 2D Canvas Stack View -->
      <div id="viewport-2d" class="viewport-2d">
        <!-- Rendered by app.js -->
      </div>

      <!-- 3D Exploded Layer View -->
      <div id="viewport-3d" class="viewport-3d">
        <div id="stage-3d" class="stage-3d">
          <!-- Populated with 3D layer cards by app.js -->
        </div>
      </div>

      <!-- Floating 3D Controls -->
      <div id="depth-controls-panel" class="depth-controls-panel">
        <label for="depth-spacing-slider">Explosion Depth:</label>
        <input type="range" id="depth-spacing-slider" min="40" max="260" value="120" class="custom-range" style="width: 130px;">
        <span id="depth-spacing-val" style="font-size: 11px; font-weight: 700; color: var(--accent-cyan); width: 45px;">120px</span>
        <button id="btn-reset-3d" class="btn-secondary" style="padding: 4px 10px; font-size: 11px;">Reset View</button>
      </div>

      <!-- Generation Loading Overlay -->
      <div id="generation-overlay" class="generation-overlay">
        <div class="spinner"></div>
        <div id="generation-text" class="generation-text">Synthesizing & Inpainting Layer...</div>
      </div>

    </section>

    <!-- Right Sidebar: Layer Tree & Targeted Prompting Inspector -->
    <aside class="sidebar-right">
      <div class="sidebar-tabs">
        <button class="tab-btn active">Layers & Targeted Prompting</button>
      </div>

      <div class="sidebar-scrollable">

        <!-- Layer Hierarchy Tree -->
        <div>
          <div class="sidebar-section-title">
            <span>Layer Hierarchy</span>
            <span id="layer-count-badge" class="brand-badge">4 Layers</span>
          </div>
          <div id="layer-tree" class="layer-tree-container">
            <!-- Populated by JavaScript -->
          </div>
        </div>

        <!-- Layer-Targeted Prompt Inspector -->
        <div class="inspector-panel">
          <div class="inspector-header">
            <div>
              <div id="selected-layer-title" style="font-size: 13px; font-weight: 700; color: #fff;">Layer Title</div>
              <div style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">Targeted Inpainting & Mutation</div>
            </div>
            <span id="selected-layer-type" class="layer-type-pill type-subject">SUBJECT</span>
          </div>

          <!-- Targeted Prompt Input -->
          <div>
            <div style="font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px;">Layer Prompt:</div>
            <textarea id="layer-prompt-input" class="prompt-textarea" style="min-height: 65px;" placeholder="Prompt this specific layer..."></textarea>
          </div>

          <!-- Quick Mutation Pills -->
          <div>
            <div style="font-size: 10px; text-transform: uppercase; font-weight: 700; color: var(--text-muted); margin-bottom: 6px;">Preset Variations:</div>
            <div id="quick-prompt-pills" class="quick-pills-row">
              <!-- Populated by JavaScript -->
            </div>
          </div>

          <button id="btn-reprompt-layer" class="btn-primary" style="width: 100%; margin-top: 4px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
            Re-synthesize Layer Only
          </button>

          <!-- Layer Modifiers -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px;">
            <div class="slider-group">
              <div class="slider-label-row">
                <span>Opacity</span>
                <span id="layer-opacity-val" style="color: var(--accent-cyan);">100%</span>
              </div>
              <input type="range" id="layer-opacity-slider" min="0" max="1" step="0.02" value="1" class="custom-range">
            </div>

            <div>
              <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 6px;">Blend Mode</div>
              <select id="layer-blend-select" class="select-control">
                <option value="source-over">Normal</option>
                <option value="screen">Screen</option>
                <option value="multiply">Multiply</option>
                <option value="overlay">Overlay</option>
                <option value="lighten">Lighten</option>
              </select>
            </div>
          </div>

          <!-- Layer Quick Action Tools -->
          <div style="display: flex; gap: 8px; margin-top: 4px;">
            <button id="btn-toggle-visibility" class="btn-secondary" style="flex: 1;">Toggle Hide</button>
            <button id="btn-solo-layer" class="btn-secondary" style="flex: 1;">Solo Layer</button>
          </div>

          <hr style="border: none; border-top: 1px solid var(--border-subtle);">

          <!-- Background Removal & Part Download -->
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <button id="btn-remove-bg" class="btn-secondary" style="width: 100%; border-color: rgba(0, 240, 255, 0.4); color: var(--accent-cyan);">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
              Remove Background / Cutout
            </button>
            <button id="btn-download-layer" class="btn-primary" style="width: 100%; background: linear-gradient(135deg, #a8ff35 0%, #00cc66 100%);">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Download Part (Transparent PNG)
            </button>
          </div>

        </div>

      </div>
    </aside>

  </main>

  <!-- Notification Toast -->
  <div id="toast" class="toast"></div>

  <!-- Scripts -->
  <script src="layers-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
